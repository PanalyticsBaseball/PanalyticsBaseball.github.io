<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Brendan Lawson amateur scouting report</title>
  <desc id="desc">A navy Panalytics Baseball scouting report cover featuring Brendan Lawson's name and shortstop profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#243b53"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1020" cy="110" r="250" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 588H1200V675H0Z" fill="#ffffff" fill-opacity=".96"/>
  <rect x="74" y="72" width="12" height="96" fill="#a63d40"/>
  <text x="112" y="112" fill="#f0a7a9" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">AMATEUR SCOUTING · 2027</text>
  <text x="72" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">BRENDAN</text>
  <text x="72" y="410" fill="#d8e5f0" font-family="Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">LAWSON</text>
  <text x="78" y="478" fill="#c4d2df" font-family="Arial, sans-serif" font-size="29" font-weight="600">SHORTSTOP · L / R · UNIVERSITY OF FLORIDA</text>
  <g transform="translate(820 250)">
    <path d="M100 0 200 58v116l-100 58L0 174V58Z" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2" stroke-width="3"/>
    <text x="100" y="112" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="70" font-weight="800">SS</text>
    <text x="100" y="152" text-anchor="middle" fill="#f0a7a9" font-family="Arial, sans-serif" font-size="22" font-weight="700">20–80 REPORT</text>
  </g>
  <text x="74" y="642" fill="#102a43" font-family="Arial, sans-serif" font-size="30" font-weight="800">PANALYTICS BASEBALL</text>
  <text x="1125" y="642" text-anchor="end" fill="#627d98" font-family="Arial, sans-serif" font-size="22" font-weight="700">EVIDENCE · CONTEXT · PROJECTION</text>
</svg>
