cv:
  name: Gabriel Sequera
  headline: Baseball Research & Development | Scouting | Baseball Operations
  location: Clifton, New Jersey
  email: gabriel.sequera@gmail.com
  summary: Bilingual baseball operations and analytics professional with experience in affiliated and independent professional baseball environments. Uses R, Python, SQL, Statcast data, and sports-technology training to clean data, evaluate player performance, build interactive tools, and translate findings into player-development recommendations. Brings additional playing and coaching perspective as a former collegiate catcher.

  social_networks:
    - network: LinkedIn
      username: gabriel-sequera
    - network: GitHub
      username: PanalyticsBaseball

  sections:
    Experience:
      - company: Panalytics Baseball
        position: Founder and Independent Baseball Analytics Researcher
        location: Remote
        start_date: 2024-07
        end_date: present
        summary: Founded an independent baseball analytics portfolio and began publishing player research projects in 2026 using public Statcast and Baseball-Reference data.
        highlights:
          - Built reproducible R workflows and decision-focused visualizations covering pitcher mechanics, pitch movement and sequencing, hitter approach, contact quality, and performance sustainability.
          - Developed the Marlins Decision Lab in Shiny with reactive filters, team-relative percentiles, player comparisons, sortable tables, Plotly tooltips, and downloadable outputs.
          - Published player-development case studies that connect statistical evidence with clear scouting observations, limitations, and recommendations.

      - company: New York Yankees, Somerset Patriots (Double-A Affiliate)
        position: Supervisor, Concessions and Guest Experience
        location: Bridgewater, New Jersey
        start_date: 2023-04
        end_date: 2025-09
        summary: Supported concessions and guest-experience operations for all scheduled Somerset Patriots home games.
        highlights:
          - Supervised a game-day team of approximately 16 employees and ensured the assigned stand was stocked, prepared, and operational before gates opened.
          - Monitored inventory, customer service, and basic food-safety practices while resolving issues during games.
          - Coordinated with colleagues during fan-entertainment activities and 50/50 raffles.

      - company: Saint Peter's University Facilities, Operations, & Recreational Life
        position: Assistant Director, Facilities, Operations & Recreational Life
        location: Jersey City, New Jersey
        start_date: 2022-09
        end_date: 2024-05
        summary: Supported game-day and technical operations for women's volleyball, men's and women's basketball, and men's and women's soccer.
        highlights:
          - Used basic R analysis to organize opponent information and support pregame preparation.
          - Edited game video, operated replay workflows for plays requiring review, and distributed live feeds and still images to television broadcast partners.
          - Coordinated event information and technical workflows with athletics staff, officials, and broadcasters.

      - company: New Jersey Jackals
        position: Baseball Operations Intern
        location: Woodland Park, New Jersey
        start_date: 2019-06
        end_date: 2019-09
        summary: Supported game-day setup, presentation, customer service, and closing operations for an independent professional baseball club.
        highlights:
          - Set up video and game-replay equipment before games.
          - Installed team banners, sponsor signage, and promotional materials throughout the ballpark.
          - Operated a concession stand and supported postgame closing by helping ensure spectators exited the stadium safely.

